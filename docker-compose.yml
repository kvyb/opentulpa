services:
  opentulpa:
    build:
      context: .
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      OPENTULPA_DATA_ROOT: /app/opentulpa_data
      OPENTULPA_SOURCE_ROOT: /app/opentulpa
      PORT: 8000
    ports:
      - "8000:8000"
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    volumes:
      - .:/app/opentulpa
      - opentulpa_data:/app/opentulpa_data
    command: ["/opt/opentulpa-install/controller/generations/image/bin/opentulpa-host"]

volumes:
  opentulpa_data:
