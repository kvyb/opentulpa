[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "/opt/opentulpa-install/controller/generations/image/bin/opentulpa-host"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# OpenTulpa is a single-active-process SQLite deployment. Never overlap releases
# that share its persistent Railway volume.
overlapSeconds = 0
drainingSeconds = 15
